<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChefAI - AI-Powered Recipe Recommender. Tell us what's in your kitchen and get personalized recipe suggestions powered by AI." />
    <meta name="keywords" content="recipe, AI, food, cooking, ingredients, recommendation, chef" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>ChefAI — AI Recipe Recommender</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="cursor-glow"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const glow = document.getElementById('cursor-glow');
      window.addEventListener('mousemove', (e) => {
        // We use requestAnimationFrame for optimal smoothness or direct manipulation
        glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      }, { passive: true });
    </script>
    <style>
      #cursor-glow {
        position: fixed;
        top: 0;
        left: 0;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 60%);
        border-radius: 50%;
        transform: translate(-50%, -50%); /* Start offscreen invisibly */
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: screen;
        margin-left: -200px;
        margin-top: -200px;
        transition: transform 0.15s cubic-bezier(0.1, 0.9, 0.2, 1);
        will-change: transform;
      }
    </style>
  </body>
</html>
